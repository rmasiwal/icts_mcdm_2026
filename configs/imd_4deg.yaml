# Configuration for IMD 4-degree resolution rainfall dataset
dataset:
  name: "IMD_4deg"
  description: "India Meteorological Department gridded rainfall at 4-degree resolution"

  data_folder: "/path/to/imd_4deg_folder"
  threshold_file: "/path/to/mwset4x4.nc4"

  file_pattern: "{year}.nc"

  precip_var: "RAINFALL"

  dim_mapping:
    LATITUDE: "lat"
    LONGITUDE: "lon"
    TIME: "time"

  threshold_var: "MWmean"

onset:
  start_month: 4
  start_day: 1
  wet_spell_window: 5
  dry_spell_window: 10
  dry_spell_threshold: 5
  dry_spell_check_days: 30
  min_first_day_rain: 1
  mok: false

years:
  start: 1901
  end: 2024

output:
  save_nc: true
  output_dir: "./output"
  filename_prefix: "onset_imd_4deg"
