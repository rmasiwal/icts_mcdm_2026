# Configuration for IMD 2-degree resolution rainfall dataset
dataset:
  name: "IMD_2deg"
  description: "India Meteorological Department gridded rainfall at 2-degree resolution"

  # Paths
  data_folder: "/path/to/imd_2deg_folder"
  threshold_file: "/path/to/mwset2x2.nc4"

  # File naming pattern: use {year} as placeholder
  # Examples: "data_{year}.nc" or "{year}.nc"
  file_pattern: "data_{year}.nc"

  # Variable name for precipitation in the NetCDF file
  precip_var: "RAINFALL"

  # Dimension name mappings: map your dataset's dim names to standard names (lat, lon, time)
  # Leave blank if already standard
  dim_mapping:
    latitude: "lat"       # rename 'latitude' -> 'lat'
    longitude: "lon"      # rename 'longitude' -> 'lon'
    # TIME: "time"        # uncomment if needed

  # Threshold variable name in the threshold file
  threshold_var: "MWmean"

# Onset detection parameters
onset:
  start_month: 4          # Start month for onset detection (April = 4)
  start_day: 1            # Start day for onset detection
  wet_spell_window: 5     # Window (days) for wet spell detection
  dry_spell_window: 10    # Window (days) for dry spell detection
  dry_spell_threshold: 5  # mm total rainfall threshold for dry spell
  dry_spell_check_days: 30 # Days after onset to check for dry spell
  min_first_day_rain: 1   # Minimum rainfall on first day of wet spell (mm)
  mok: false              # Apply MOK (Monsoon Onset Kerala) June 2 filter

# Years to process
years:
  start: 1901
  end: 2024

# Output
output:
  save_nc: true
  output_dir: "./output"
  filename_prefix: "onset_imd_2deg"
