# Configuration for ERA5 rainfall regridded to IMD 1-degree grid
dataset:
  name: "ERA5_1deg"
  description: "ERA5 reanalysis total precipitation regridded to IMD 1-degree grid (1998-2025)"

  # Paths
  data_folder: "/Users/Rajat/Library/CloudStorage/OneDrive-TheUniversityofChicago/documents/conferences/icts_monsoon_26/mr_onset/data/era5_imd_grid"
  threshold_file: "/Users/Rajat/Library/CloudStorage/OneDrive-TheUniversityofChicago/documents/conferences/icts_monsoon_26/mr_onset/data/mwset1x1.nc4"

  # File naming pattern: use {year} as placeholder
  file_pattern: "era5_{year}.nc"

  # Variable name for precipitation in the NetCDF file
  precip_var: "precip"

  # Dimension name mappings: ERA5 already uses standard names - no renaming needed
  dim_mapping: {}

  # Threshold variable name in the threshold file
  threshold_var: "MWmean"

  # Path to India boundary shapefile (.shp) for map outlines
  shapefile: "/Users/Rajat/Library/CloudStorage/OneDrive-TheUniversityofChicago/documents/conferences/icts_monsoon_26/mr_onset/data/ind_map_shpfile/india_shapefile.shp"

# Onset detection parameters
onset:
  start_month: 4           # Start month for onset detection (April = 4)
  start_day: 1             # Start day for onset detection
  wet_spell_window: 5      # Window (days) for wet spell detection
  dry_spell_window: 10     # Window (days) for dry spell detection
  dry_spell_threshold: 5   # mm total rainfall threshold for dry spell
  dry_spell_check_days: 30 # Days after onset to check for dry spell
  min_first_day_rain: 1    # Minimum rainfall on first day of wet spell (mm)
  mok: false               # Apply MOK (Monsoon Onset Kerala) June 2 filter

# Years to process
years:
  start: 1998
  end: 2025

# Output
output:
  save_nc: true
  save_csv: true
  output_dir: "./output"
  filename_prefix: "onset_era5_1deg"
